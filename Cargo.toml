# Workspace root.
#
# The split is deliberate and is expected to outlive the MCP interface:
#
#   acl2-session      the core. Owns the ACL2 process, the file-prefix
#                     invariant, form splitting, and structured extraction.
#                     Knows nothing about MCP, JSON, or any transport.
#
#   acl2-session-mcp  the MCP server. A thin mapping from tool calls onto the
#                     core, owning its own wire types.
#
#   acl2-session-editor  the editor daemon. JSON-RPC 2.0 over stdio; a
#                     stepping driver per book turns syncs into the event
#                     stream an editor paints from. Owns its own wire types,
#                     richer than the MCP's on purpose.
#
# The core must stay usable by any one interface without dragging in the
# others' dependencies.

[workspace]
resolver = "3"
members = [
    "crates/acl2-session",
    "crates/acl2-session-mcp",
    "crates/acl2-session-editor",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
repository = "https://github.com/gjurgensen/acl2-session-server"
readme = "README.md"
keywords = ["acl2", "theorem-prover", "mcp", "formal-verification"]
categories = ["development-tools", "api-bindings"]
