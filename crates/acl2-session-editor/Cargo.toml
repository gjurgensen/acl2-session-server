# The editor daemon: JSON-RPC 2.0 over stdio, one stepping driver per book.
# Deliberately no async runtime -- a reader loop, a writer lock, and a thread
# per book cover what a handful of editor sessions needs.

[package]
name = "acl2-session-editor"
description = "Editor daemon exposing a live ACL2 session over JSON-RPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
acl2-session = { path = "../acl2-session", version = "0.0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "acl2-session-editor"
path = "src/main.rs"
